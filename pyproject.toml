[project]
name = "student-career-app"
version = "1.0.0"
description = "Predicts a student's willingness to pursue a career using ML models based on attitude and behavior."
readme = "README.md"
requires-python = ">=3.9,<3.12"

dependencies = [
    "streamlit~=1.28",
    "pandas~=1.5",
    "numpy~=1.24",
    "scikit-learn~=1.3",
    "plotly~=5.15",
    "joblib~=1.3",
    "statsmodels~=0.14",
    "xgboost~=1.7.6",
    "lightgbm~=4.5",
    "shap~=0.46",
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.51",
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "requests>=2.32.5",
    "aiosqlite>=0.22.1",
]
