[project]
name = "student-career-readiness-predictor"
version = "1.0.0"
description = "Predicts junior developer career readiness using machine learning."
readme = "README.md"
requires-python = ">=3.9,<3.12"

dependencies = [
    "streamlit~=1.28",
    "pandas~=1.5",
    "numpy~=1.24",
    "scikit-learn~=1.3",
    "plotly~=5.15",
    "joblib~=1.3",
    "statsmodels~=0.14",
    "xgboost~=1.7.6",
    "lightgbm~=4.5",
    "shap~=0.46",
    "fastapi>=0.128.8",
    "uvicorn>=0.39.0",
    "pydantic>=2.13.4",
    "python-multipart>=0.0.20",
    "sqlalchemy>=2.0.51",
    "alembic>=1.16.5",
    "asyncpg>=0.31.0",
    "requests>=2.32.5",
    "aiosqlite>=0.22.1",
    "mlflow>=3.1.4",
]

[dependency-groups]
dev = [
    "faker>=37.12.0",
    "httpx>=0.28.1",
    "mypy>=1.19.1",
    "pre-commit>=4.3.0",
    "pytest>=8.4.2",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.1",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM"]

[tool.mypy]
strict = true
ignore_missing_imports = true
warn_return_any = true
