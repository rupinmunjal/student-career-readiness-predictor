repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.1
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.19.1
    hooks:
      - id: mypy
        args: [src/, api.py, app.py]
        pass_filenames: false
        additional_dependencies:
          - fastapi>=0.128.8
          - pandas-stubs>=1.5.3
          - sqlalchemy>=2.0.51
          - streamlit>=1.28
          - types-requests>=2.32.0
